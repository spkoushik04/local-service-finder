# ========================================================================
# MySQL Database Configuration Profile
# To activate, launch with: --spring.profiles.active=mysql
# ========================================================================

server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/local_service_finder?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
