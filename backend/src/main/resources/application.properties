# ========================================================================
# Local Service Finder - Spring Boot Application Configuration
# MySQL Database Configuration
# ========================================================================

server.port=8080
spring.application.name=local-service-finder

# MySQL Datasource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/local_service_finder?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Root@123

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson JSON formatting
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
